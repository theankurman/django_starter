########
# RUFF #
########
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0"                                       # Ruff version.

[[repos.hooks]]
id = "ruff-format"


######
# UV #
######
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.0"

[[repos.hooks]]
id = "uv-lock"

[[repos.hooks]]
id = "uv-export"

##########
# CUSTOM #
##########
[[repos]]
repo = "local"

# prettier
[[repos.hooks]]
id = "local-prettier"
name = "prettier"
language = "system"
entry = "pnpm prettier --write"
files = { glob = ["*.js", "*.ts", "*.html"] }
