[project]
name = "django-starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dj-database-url>=3.0.1",
    "django>=6.0",
    "django-allauth>=65.13.1",
    "django-debug-toolbar>=6.2.0",
    "django-vite>=3.1.0",
    "huey>=2.6.0",
    "python-dotenv>=1.2.1",
    "waitress>=3.0.2",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-django>=4.12.0"]


[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
