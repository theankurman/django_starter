[project]
name = "django-starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dj-database-url>=3.0.1",
    "django>=6.0",
    "django-allauth>=65.13.1",
    "django-debug-toolbar>=6.2.0",
    "django-vite>=3.1.0",
    "huey>=2.6.0",
    "python-dotenv>=1.2.1",
    "waitress>=3.0.2",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = ["djlint>=1.36.4"]

[tool.djlint]
format_css = true
format_js = true
line_break_after_multiline_tag = true
preserve_blank_lines = true
profile = "django"
