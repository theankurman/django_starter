{% extends "users/layouts/guest.html" %}

{% block head_title %}Sign In{% endblock head_title %}

{% block main %}
    <h1 class="text-3xl font-bold text-center mb-8">Sign In</h1>

    <p class="text-sm text-center mb-6 opacity-80">
        If you have not created an account yet, then please
        <a href="{% url 'account_signup' %}" class="link link-primary">
            sign up
        </a>
        first.
    </p>

    <form method="post" action="{% url 'account_login' %}" class="grid gap-4">
        {% csrf_token %}
        {{ form.as_div }}

        <button type="submit" class="btn btn-primary w-full mt-2">
            Sign In
        </button>
    </form>
{% endblock main %}
