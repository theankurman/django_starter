{% extends "users/layouts/guest.html" %}

{% block head_title %}Sign Up{% endblock head_title %}

{% block main %}
    <h1 class="text-3xl font-bold text-center mb-8">Sign Up</h1>

    <p class="text-sm text-center mb-6 opacity-80">
        Already have an account? Then please
        <a href="{% url 'account_login' %}" class="link link-primary">
            sign in
        </a>
        .
    </p>

    <form method="post" action="{% url 'account_signup' %}" class="grid gap-4">
        {% csrf_token %}
        {{ form.as_div }}

        <button type="submit" class="btn btn-primary w-full mt-2">
            Sign Up
        </button>
    </form>
{% endblock main %}
