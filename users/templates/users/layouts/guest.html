{% extends "core/layouts/base.html" %}

{% block body %}
    <div
        class="min-h-screen w-full bg-cover bg-center bg-no-repeat relative bg-[url('https://picsum.photos/1920/1080')]"
    >
        <!-- Overlay: full screen on mobile, right 1/3 on larger screens -->
        <div
            class="absolute inset-0 bg-base-100/80 backdrop-blur-sm 
                    md:w-1/3 md:left-auto md:right-0 
                    flex items-center justify-center"
        >
            <div class="w-full max-w-sm px-4">
                {% block main %}
                {% endblock main %}
            </div>
        </div>
    </div>
{% endblock body %}
